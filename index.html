<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Tabungan & Pengeluaran</title>
    <!-- Tailwind CSS untuk styling cepat dan rapi -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800 antialiased selection:bg-blue-500 selection:text-white">

    <div class="max-w-md mx-auto p-4 sm:p-6 pb-12">
        <!-- Header -->
        <header class="mb-6 text-center pt-2">
            <h1 class="text-2xl font-bold text-slate-900">Dompet Saku</h1>
            <p class="text-sm text-slate-500">Kelola Tabungan & Pengeluaran Tanpa Database</p>
        </header>

        <!-- Kartu Saldo Utama -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white p-6 rounded-2xl shadow-lg mb-6">
            <p class="text-xs uppercase tracking-wider text-blue-100 font-semibold">Total Saldo Tabungan</p>
            <h2 id="totalSaldo" class="text-3xl font-extrabold mt-1">Rp 0</h2>
            
            <div class="grid grid-cols-2 gap-4 mt-6 pt-4 border-t border-blue-500/40 text-sm">
                <div>
                    <span class="block text-blue-200 text-xs">Total Pemasukan</span>
                    <span id="totalPemasukan" class="font-bold text-sm sm:text-base">Rp 0</span>
                </div>
                <div>
                    <span class="block text-blue-200 text-xs">Total Pengeluaran</span>
                    <span id="totalPengeluaran" class="font-bold text-sm sm:text-base">Rp 0</span>
                </div>
            </div>
        </div>

        <!-- Form Aksi (Tambah Uang / Catat Pengeluaran) -->
        <div class="bg-white p-5 rounded-2xl shadow-sm mb-6 border border-slate-200">
            <h3 class="text-base font-bold text-slate-800 mb-4">Catat Transaksi Baru</h3>
            <form id="transaksiForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tipe Transaksi</label>
                    <select id="tipe" class="w-full px-3 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white text-base">
                        <option value="masuk">Tambah Uang (Pemasukan)</option>
                        <option value="keluar">Pengeluaran</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Keterangan</label>
                    <input type="text" id="keterangan" placeholder="Contoh: Gaji bulanan, Beli makan..." required class="w-full px-3 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-base">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nominal (Rp)</label>
                    <input type="number" id="nominal" placeholder="Contoh: 50000" min="1" required class="w-full px-3 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-base">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold py-3.5 rounded-xl transition duration-200 shadow-md text-base">
                    Simpan Transaksi
                </button>
            </form>
        </div>

        <!-- Riwayat Transaksi -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-base font-bold text-slate-800">Riwayat Transaksi</h3>
                <button onclick="resetData()" class="text-xs text-red-500 hover:text-red-700 font-medium py-1 px-2">Reset Semua</button>
            </div>
            
            <div id="riwayatList" class="space-y-3 max-h-72 overflow-y-auto pr-1">
                <!-- List transaksi akan masuk lewat JavaScript -->
            </div>
            <div id="emptyState" class="text-center py-8 text-slate-400 text-sm hidden">
                Belum ada transaksi tercatat.
            </div>
        </div>
    </div>

    <script>
        // Ambil data dari LocalStorage atau buat array kosong jika belum ada
        let transaksi = JSON.parse(localStorage.getItem('dompet_transaksi')) || [];

        const form = document.getElementById('transaksiForm');
        const inputTipe = document.getElementById('tipe');
        const inputKeterangan = document.getElementById('keterangan');
        const inputNominal = document.getElementById('nominal');
        
        const totalSaldoEl = document.getElementById('totalSaldo');
        const totalPemasukanEl = document.getElementById('totalPemasukan');
        const totalPengeluaranEl = document.getElementById('totalPengeluaran');
        const riwayatListEl = document.getElementById('riwayatList');
        const emptyStateEl = document.getElementById('emptyState');

        // Format angka ke format Rupiah
        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        }

        // Render data ke layar
        function updateUI() {
            riwayatListEl.innerHTML = '';
            let pemasukan = 0;
            let pengeluaran = 0;

            if (transaksi.length === 0) {
                emptyStateEl.classList.remove('hidden');
            } else {
                emptyStateEl.classList.add('hidden');

                // Urutkan dari yang terbaru
                const reversedTransaksi = [...transaksi].reverse();

                reversedTransaksi.forEach((item, index) => {
                    const originalIndex = transaksi.length - 1 - index; // Indeks asli di array utama
                    if (item.tipe === 'masuk') {
                        pemasukan += Number(item.nominal);
                    } else {
                        pengeluaran += Number(item.nominal);
                    }

                    const card = document.createElement('div');
                    card.className = "flex justify-between items-center p-3.5 rounded-xl border border-slate-100 bg-slate-50 hover:bg-slate-100 transition";
                    
                    card.innerHTML = `
                        <div class="flex items-center space-x-3 overflow-hidden pr-2">
                            <div class="w-10 h-10 shrink-0 rounded-full flex items-center justify-center font-bold text-lg ${item.tipe === 'masuk' ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'}">
                                ${item.tipe === 'masuk' ? '+' : '-'}
                            </div>
                            <div class="truncate">
                                <h4 class="font-semibold text-slate-800 text-sm truncate">${item.keterangan}</h4>
                                <span class="text-xs text-slate-400 block">${item.tanggal}</span>
                            </div>
                        </div>
                        <div class="text-right flex items-center space-x-2 shrink-0">
                            <span class="font-bold text-xs sm:text-sm ${item.tipe === 'masuk' ? 'text-emerald-600' : 'text-rose-600'}">
                                ${item.tipe === 'masuk' ? '+' : '-'} ${formatRupiah(item.nominal)}
                            </span>
                            <button onclick="hapusTransaksi(${originalIndex})" class="w-7 h-7 flex items-center justify-center text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition font-bold text-base">×</button>
                        </div>
                    `;
                    riwayatListEl.appendChild(card);
                });
            }

            const saldoAkhir = pemasukan - pengeluaran;

            totalSaldoEl.innerText = formatRupiah(saldoAkhir);
            totalPemasukanEl.innerText = formatRupiah(pemasukan);
            totalPengeluaranEl.innerText = formatRupiah(pengeluaran);

            // Simpan ke localStorage setiap ada perubahan
            localStorage.setItem('dompet_transaksi', JSON.stringify(transaksi));
        }

        // Tambah transaksi baru
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const sekarang = new Date();
            const tanggalStr = sekarang.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) + ' ' + sekarang.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

            const transaksiBaru = {
                tipe: inputTipe.value,
                keterangan: inputKeterangan.value,
                nominal: parseFloat(inputNominal.value),
                tanggal: tanggalStr
            };

            transaksi.push(transaksiBaru);
            updateUI();

            // Reset form
            inputKeterangan.value = '';
            inputNominal.value = '';
            inputKeterangan.focus();
        });

        // Hapus transaksi satuan
        window.hapusTransaksi = function(index) {
            if (confirm("Apakah kamu yakin ingin menghapus transaksi ini?")) {
                transaksi.splice(index, 1);
                updateUI();
            }
        }

        // Reset semua data
        window.resetData = function() {
            if (confirm("Yakin ingin menghapus seluruh riwayat dan saldo?")) {
                transaksi = [];
                localStorage.removeItem('dompet_transaksi');
                updateUI();
            }
        }

        // Jalankan saat pertama kali dibuka
        updateUI();
    </script>
</body>
</html>
